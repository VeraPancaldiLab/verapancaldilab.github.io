<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand-title">{{ site.subtitle }}</span>
    <span class="brand-tagline">{{ site.title }}</span>
    <span class="brand-rule" aria-hidden="true"></span>
    <span class="brand-sub">Cancer Research Center of Toulouse (CRCT)</span>
    <span class="brand-sub">Toulouse, France</span>
  </a>
</header>
<div class="nav-bar">
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">
  <label for="nav-toggle" class="nav-toggle-label"><span class="nav-toggle-icon" aria-hidden="true"></span>Menu</label>
  <nav class="site-nav">
    {% for item in site.nav %}
    <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</div>
