<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}

  <main>
    {% if page.heading %}
    <section class="section page-title">
      <h1>{{ page.heading }}</h1>
      {% if page.lead %}<p>{{ page.lead }}</p>{% endif %}
    </section>
    {% endif %}

    {{ content }}
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/header-network.js' | relative_url }}" defer></script>
  {% if page.scripts %}{% for s in page.scripts %}
  <script src="{{ s | relative_url }}"></script>
  {% endfor %}{% endif %}
</body>
</html>
