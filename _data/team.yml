- name: Vera Pancaldi
  role: Team leader · Permanent scientist
  group: pi
  photo: pancaldi.jpg
  bio: Trained as a physicist at Imperial College London with 13 years of experience in computational
    biology. Since 2018 she leads the NetB(IO)² team at the Cancer Research Center of Toulouse (CRCT)
    as the recipient of the Chair for bioinformatics in Oncology of the CRCT, working on modelling cancer
    and, in particular, cellular interactions in the tumour microenvironment.
